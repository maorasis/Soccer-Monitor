name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  soccer:
    name: Soccer monitor (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        working-directory: soccer_monitor
        run: uv run --frozen python -m unittest -v

  reem:
    name: Reem copy trader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: reem_trading
        run: uv sync --frozen
      - name: Run tests
        working-directory: reem_trading
        run: uv run --frozen python -m unittest discover -s tests -v
